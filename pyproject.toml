[build-system]
requires = ["setuptools>=77.0", "cython>=3.1.0,<4"]

[project]
name = "pyav-rkmpp"
description = "PyAV bindings built for ffmpeg-rockchip and Rockchip MPP."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "WyattBlue", email = "wyattblue@auto-editor.com"},
    {name = "Jeremy Lainé", email = "jeremy.laine@m4x.org"},
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dynamic = ["version"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["av*"]

[tool.setuptools.dynamic]
version = {attr = "av.about.__version__"}

[project.urls]
"Bug Tracker" = "https://github.com/happyme531/pyav-rkmpp/issues"
"Source Code" = "https://github.com/happyme531/pyav-rkmpp"
homepage = "https://github.com/happyme531/pyav-rkmpp"

[project.scripts]
"pyav" = "av.__main__:main"

[tool.isort]
profile = "black"
known_first_party = ["av"]
skip = ["av/__init__.py"]
