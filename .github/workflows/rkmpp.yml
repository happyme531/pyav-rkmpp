name: rkmpp-arm64

on:
  push:
    branches:
      - main
      - "rkmpp/**"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rkmpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-arm64:
    name: Build bundled ARM64 wheel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import runpy; print(runpy.run_path("av/about.py")["__version__"])')"
          test "${RELEASE_TAG}" = "v${version}"

      - name: Build in manylinux_2_28_aarch64
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -euxo pipefail -c '
              dnf install -y cmake git ninja-build pkgconf-pkg-config
              CFLAGS="-O2 -Wno-error=array-bounds" \
                PYTHON_BIN=/opt/python/cp310-cp310/bin/python \
                JOBS=4 ./scripts/build-rkmpp
              source .rkmpp-build/env.sh
              export PKG_CONFIG_PATH=
              export PKG_CONFIG_LIBDIR="${PYAV_RKMPP_FFMPEG_PREFIX}/lib/pkgconfig:${PYAV_RKMPP_FFMPEG_PREFIX}/share/pkgconfig"
              /opt/python/cp311-cp311/bin/python -m venv /tmp/build-cp311
              /tmp/build-cp311/bin/python -m pip install \
                "setuptools==80.9.0" \
                "Cython==3.1.3" \
                "wheel==0.45.1"
              /tmp/build-cp311/bin/python setup.py clean --all
              /tmp/build-cp311/bin/python -m pip wheel \
                --no-build-isolation \
                --no-deps \
                --wheel-dir dist-rkmpp \
                .
              .rkmpp-build/venv/bin/python -m pip install \
                auditwheel "patchelf>=0.14.5"
              export PATH="/project/.rkmpp-build/venv/bin:${PATH}"
              mkdir -p wheelhouse
              for wheel in dist-rkmpp/pyav_rkmpp-*.whl
              do
                .rkmpp-build/venv/bin/auditwheel show "${wheel}"
                .rkmpp-build/venv/bin/auditwheel repair \
                  --plat manylinux_2_28_aarch64 \
                  --wheel-dir wheelhouse \
                  "${wheel}"
              done
              cp310_wheels=(/project/wheelhouse/pyav_rkmpp-*-cp310-cp310-manylinux_2_28_aarch64.whl)
              abi3_wheels=(/project/wheelhouse/pyav_rkmpp-*-cp311-abi3-manylinux_2_28_aarch64.whl)
              test "${#cp310_wheels[@]}" -eq 1
              test "${#abi3_wheels[@]}" -eq 1
              for python_tag in \
                cp310-cp310 \
                cp311-cp311 \
                cp312-cp312 \
                cp313-cp313 \
                cp314-cp314
              do
                python_bin="/opt/python/${python_tag}/bin/python"
                test -x "${python_bin}"
                if [[ "${python_tag}" == cp310-cp310 ]]; then
                  wheel="${cp310_wheels[0]}"
                else
                  wheel="${abi3_wheels[0]}"
                fi
                verify_dir="/tmp/verify-${python_tag}"
                "${python_bin}" -m venv "${verify_dir}"
                "${verify_dir}/bin/pip" install "${wheel}"
                (
                  cd /tmp
                  unset LD_LIBRARY_PATH
                  "${verify_dir}/bin/python" \
                    /project/scripts/verify-rkmpp-install.py
                )
              done
            '

      - name: Upload PyPI wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyav-rkmpp-wheel-aarch64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish ARM64 wheel from x64
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-arm64
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyav-rkmpp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download ARM64 wheel
        uses: actions/download-artifact@v7
        with:
          name: pyav-rkmpp-wheel-aarch64
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
