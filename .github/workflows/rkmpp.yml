name: rkmpp-arm64

on:
  push:
    branches:
      - main
      - "rkmpp/**"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rkmpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-arm64:
    name: Build bundled ARM64 wheel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import runpy; print(runpy.run_path("av/about.py")["__version__"])')"
          test "${RELEASE_TAG}" = "v${version}"

      - name: Build in manylinux_2_28_aarch64
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -euxo pipefail -c '
              dnf install -y cmake git ninja-build pkgconf-pkg-config
              CFLAGS="-O2 -Wno-error=array-bounds" \
                PYTHON_BIN=/opt/python/cp311-cp311/bin/python \
                JOBS=4 ./scripts/build-rkmpp
              source .rkmpp-build/env.sh
              .rkmpp-build/venv/bin/python -m pip install \
                auditwheel "patchelf>=0.14.5"
              export PATH="/project/.rkmpp-build/venv/bin:${PATH}"
              mkdir -p wheelhouse
              .rkmpp-build/venv/bin/auditwheel show \
                dist-rkmpp/pyav_rkmpp-*.whl
              .rkmpp-build/venv/bin/auditwheel repair \
                --plat manylinux_2_28_aarch64 \
                --wheel-dir wheelhouse \
                dist-rkmpp/pyav_rkmpp-*.whl
              /opt/python/cp311-cp311/bin/python -m venv /tmp/verify
              cd /tmp
              /tmp/verify/bin/pip install /project/wheelhouse/pyav_rkmpp-*.whl
              unset LD_LIBRARY_PATH
              /tmp/verify/bin/python /project/scripts/verify-rkmpp-install.py
            '

      - name: Upload PyPI wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyav-rkmpp-wheel-aarch64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish ARM64 wheel from x64
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-arm64
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyav-rkmpp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download ARM64 wheel
        uses: actions/download-artifact@v7
        with:
          name: pyav-rkmpp-wheel-aarch64
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
